name: Publish to npm

on:
  release:
    types: [published]
  push:
    # Redundant with the release trigger: creating a release soon after a push
    # to the same commit can silently drop the release event for a job whose
    # body is `uses: <external-repo>/...@v1` (see johnhenry/workflows' README).
    # A double fire is safe; the `npm view` guard in the reusable workflow makes
    # the second run a no-op. To retry: re-push the tag, or run this workflow
    # with workflow_dispatch.
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token:
        write # required by the reusable workflow's provenance step; the
        # caller job must declare it too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # The full gate, including the real-browser suite (Chromium, Firefox,
      # WebKit + axe scan). It runs inside the reusable workflow's gate step
      # rather than as a separate job, so a red browser run blocks the publish.
      # Publishing itself (`npm view` guard, --provenance --access public) is
      # done by the reusable workflow.
      gate-commands: |
        npx playwright install --with-deps
        npm test
        npm run examples
        npm run test:types
        npm run test:browser
    secrets: inherit
