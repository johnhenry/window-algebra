name: Publish to npm

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of npm-publish.yml
      id-token: write # npm provenance
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # The full gate, including the real-browser suite (Chromium, Firefox,
      # WebKit + axe scan). It runs inside the reusable workflow's gate step
      # rather than as a separate job, so a red browser run blocks the publish.
      # Publishing itself (`npm view` guard, --provenance --access public) is
      # done by the reusable workflow.
      gate-commands: |
        npx playwright install --with-deps
        npm test
        npm run examples
        npm run test:types
        npm run test:browser
    secrets: inherit
