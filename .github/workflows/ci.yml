# Family-standard single-package CI workflow (adopt-library Phase 3).
#
# PENDING -- not yet built: `johnhenry/workflows` will offer this as a
# `workflow_call` target (`ci.yml@v1` with matrix / gate / drift-check
# inputs). Until it is tagged v1, inline this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref -- the
# whole family shares this block so a rapid push sequence never queues N
# redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node >=26.0.0 -- test the floor version directly rather
        # than a matrix of now-unsupported older majors.
        node-version: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # `cache: npm` is fine on ubuntu-latest; never on a self-hosted runner.
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Examples smoke test
        run: npm run examples
      - name: Package contents
        # Read the list, not just the exit code: only src/ plus README,
        # LICENSE and package.json should ship (no demo/, test/, docs/).
        run: npm pack --dry-run
