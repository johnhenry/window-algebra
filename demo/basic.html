<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Start</title>
    <link rel="stylesheet" href="./shared/style.css" />
    <style>
      #desktop { margin: 8px; border-radius: 10px; border: 1px solid var(--line); }
      .win { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      .win header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: 8px 8px 0 0; user-select: none; }
      [data-mode="floating"] .win header { cursor: move; }
      .win header strong { flex: 1; font-size: 13px; }
      .win header button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; }
      .win .body { padding: 12px; overflow: auto; color: var(--muted); }
      .grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
      /* Windows are size containers: content adapts via container queries. */
      @container wm-view (width < 260px) { .win .body .detail { display: none; } }
    </style>
  </head>
  <body class="app" style="grid-template-rows: auto auto 1fr">
    <header class="site"></header>
    <nav class="toolbar">
      <button class="btn small" id="new">New window</button>
      <button class="btn small" id="float">Toggle floating</button>
      <button class="btn small" id="dialog">Modal dialog</button>
      <button class="btn small" id="close">Close</button>
      <span class="sep"></span>
      <select id="layout" aria-label="Layout">
        <option value="master-stack">master-stack</option>
        <option value="bsp">bsp</option>
        <option value="columns">columns</option>
        <option value="rows">rows</option>
        <option value="grid">grid (auto-fit)</option>
        <option value="spiral">spiral</option>
        <option value="tabs">tabs</option>
        <option value="monocle">monocle</option>
        <option value="floating">floating</option>
      </select>
      <label class="inline">ratio <input id="ratio" type="range" min="0.2" max="0.8" step="0.05" value="0.5" /></label>
      <span class="sep"></span>
      <button class="btn small" id="undo">Undo</button>
      <button class="btn small" id="redo">Redo</button>
      <button class="btn small" id="next">Focus next</button>
    </nav>
    <div id="desktop" class="stage"></div>

    <script type="module">
      import { createWindowManager, createState } from "../src/index.mjs";
      import { createDomRenderer, attachInput, lazySurface, createSurfaceRegistry, createFrameScheduler } from "../src/browser/index.mjs";
      import { initPage } from "./shared/kit.mjs";

      // Page furniture only (header + theme); the demo below uses the library directly.
      initPage({ current: "./basic.html", title: "Quick start" });

      const root = document.getElementById("desktop");
      const surfaces = createSurfaceRegistry();
      const renderer = createDomRenderer({ root, surfaceFor: surfaces });
      const wm = createWindowManager({
        state: createState({ config: { gap: 6, inset: 6 } }),
        renderer,
        schedule: createFrameScheduler(),
        history: 200,
      });
      attachInput({ root, getState: wm.getState, dispatch: wm.dispatch });

      let counter = 0;
      const makeSurface = (id, title) =>
        lazySurface((target) => {
          target.innerHTML = `
            <div class="win">
              <header data-wm-handle="move">
                <strong></strong>
                <button data-wm-command="window/toggle-floating" title="Float">⧉</button>
                <button data-wm-command="window/close" title="Close">×</button>
              </header>
              <div class="body">
                <p>${id}</p>
                <p class="detail">Resize me: this line hides below 260px via a container query.</p>
              </div>
            </div>
            <div class="grip" data-wm-handle="resize-se"></div>`;
          target.querySelector("strong").textContent = title;
        });

      const open = (options = {}) => {
        const id = options.id ?? `w${++counter}`;
        const title = options.title ?? `Window ${counter}`;
        surfaces.set(id, makeSurface(id, title));
        wm.create({ id, title, ...options });
        return id;
      };

      open({ title: "Editor" });
      open({ title: "Terminal" });
      open({ title: "Browser" });

      const focused = () => wm.state.focus.window;
      document.getElementById("new").onclick = () => open();
      document.getElementById("float").onclick = () => focused() && wm.toggleFloating(focused());
      document.getElementById("close").onclick = () => focused() && wm.close(focused());
      document.getElementById("dialog").onclick = () => {
        const parent = focused();
        if (!parent) return;
        const id = open({ role: "dialog", parent, modal: true, title: "Confirm", placement: { width: 280, height: 160 } });
        wm.setMode(id, "floating");
      };
      document.getElementById("layout").onchange = (event) => {
        const type = event.target.value;
        wm.setLayout(type === "grid" ? { type, min: 280 } : { type, ratio: Number(document.getElementById("ratio").value) });
      };
      document.getElementById("ratio").oninput = (event) => wm.setRatio(Number(event.target.value));
      document.getElementById("undo").onclick = () => wm.undo();
      document.getElementById("redo").onclick = () => wm.redo();
      document.getElementById("next").onclick = () => wm.focusNext();

      // Expose for tinkering in devtools.
      window.wm = wm;
    </script>
  </body>
</html>
